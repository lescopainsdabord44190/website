# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "copains-dabord"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed/prod_data_local.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3450"
additional_redirect_urls = ["http://localhost:3450/**", "http://127.0.0.1:3450/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[edge_runtime.secrets]
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
SITE_URL = "http://localhost:3450"
CONTACT_EMAIL_TO = "contact@alsh-getigne.fr"
CONTACT_EMAIL_FROM = "noreply@alsh-getigne.fr"
BREVO_API_KEY = "env(BREVO_API_KEY)"

[functions.send-contact-email]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-contact-email/index.ts"

[functions.verify-turnstile]
enabled = true
verify_jwt = false
entrypoint = "./functions/verify-turnstile/index.ts"

[functions.admin-users]
enabled = true
verify_jwt = false
import_map = "./functions/admin-users/deno.json"
entrypoint = "./functions/admin-users/index.ts"

[analytics]
enabled = false
port = 54327
backend = "postgres"
